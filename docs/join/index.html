<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Amberline</title>
<style>
:root{color-scheme:dark;--top:#13233a;--bottom:#03060c;--panel:#0b1728;--inner:#060e1a;--gold:#c9ab6f;--gold-dim:#806a3a;
--gold-hi:#f3e2b3;--text:#e9e2d0;--muted:#a3a9b5;--field:#040a13;--line:#8593a8;--focus:#f2d98e;--bad:#f2978b;--bad-bg:#2b1414;
--ok:#a6dcae;--ok-bg:#122418}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bottom)}
body{margin:0;padding:48px 16px;min-height:100vh;color:var(--text);background:radial-gradient(120% 70% at 50% 0%,var(--top),var(--bottom) 75%);
font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:30rem;margin:0 auto;padding:28px 24px 30px;border:1px solid var(--gold-dim);border-radius:4px;overflow-wrap:anywhere;
text-align:center;background:linear-gradient(180deg,var(--panel),var(--inner));box-shadow:inset 0 0 0 1px rgba(201,171,111,.14),0 16px 40px rgba(0,0,0,.55)}
@media (max-width:23rem){main{padding-left:16px;padding-right:16px}h1{font-size:1rem}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{margin:0 0 26px;text-align:center}
.wordmark{position:relative;display:inline-block;margin:0 -.3em 0 0;padding:0 0 20px;color:var(--gold);letter-spacing:.3em;text-transform:uppercase;
font:600 clamp(1.9rem,8.5vw,2.75rem)/1.1 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
background:linear-gradient(105deg,transparent 42%,rgba(255,248,224,.95) 50%,transparent 58%) 160% 0/250% 100% no-repeat,
linear-gradient(180deg,#fff4d2 0%,#f1d48c 30%,#c99c4c 52%,#8b6327 58%,#d7b36a 78%,#f7e6b0 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 12px rgba(201,171,111,.35)) drop-shadow(0 2px 0 rgba(0,0,0,.9));animation:sheen 7s ease-in-out 1s infinite}
.wordmark::before,.wordmark::after{content:"";position:absolute;left:50%}
.wordmark::before{bottom:3px;width:9px;height:9px;background:var(--gold-hi);box-shadow:0 0 10px var(--gold);transform:translateX(calc(-50% - .15em)) rotate(45deg)}
.wordmark::after{bottom:7px;width:115%;height:1px;transform:translateX(calc(-50% - .15em));
background:linear-gradient(90deg,transparent,var(--gold) 22%,var(--gold) 44%,transparent 46.5%,transparent 53.5%,var(--gold) 56%,var(--gold) 78%,transparent)}
@keyframes sheen{0%,55%{background-position:160% 0,0 0}100%{background-position:-60% 0,0 0}}
@media (prefers-reduced-motion:reduce){.wordmark{animation:none}}
h1{margin:0 0 22px;color:var(--gold);font-size:1.125rem;line-height:1.35;font-weight:600;letter-spacing:.16em;text-align:center;text-transform:uppercase;overflow-wrap:anywhere}
p{max-width:65ch;margin:0 0 14px}
.muted{color:var(--muted);font-size:.9375rem}
.problem{position:relative;max-width:none;margin:0 0 22px;padding:12px 16px 12px 46px;border:1px solid var(--bad);border-radius:2px;background:var(--bad-bg);text-align:left}
.problem::before{content:"\2717";position:absolute;left:14px;top:13px;width:20px;height:20px;border:1px solid;border-radius:50%;color:var(--bad);font:700 .75rem/18px system-ui,sans-serif;text-align:center}
.steps{margin:0;padding:0;list-style:none;counter-reset:step;text-align:left}
.steps>li{position:relative;counter-increment:step;padding:0 0 24px 46px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border:1px solid var(--gold);border-radius:50%;background:linear-gradient(180deg,#1d2e45,#0a1322);color:var(--gold-hi);font:700 .9375rem/28px system-ui,sans-serif;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin:0 0 12px;padding:8px 18px;border:1px solid var(--gold);border-radius:2px;background:linear-gradient(180deg,#1d2e45,#0a1322);color:var(--gold-hi);font:inherit;font-weight:600;letter-spacing:.12em;line-height:1.3;text-align:center;text-transform:uppercase;text-decoration:none;overflow-wrap:anywhere;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 #3b2c13}
.btn:hover{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #3b2c13,0 0 16px rgba(201,171,111,.5)}
.btn.secondary{background:transparent}
@media (forced-colors:active){.btn{border-color:ButtonText}.problem{border-color:CanvasText}.wordmark{background:none;-webkit-text-fill-color:CanvasText;filter:none}}
</style>
</head>
<body>
<header><p class="wordmark" id="mark">AMBERLINE</p></header>
<main>
  <h1 id="heading">Join Amberline</h1>
  <noscript><p class="problem">This page needs JavaScript to read the invite.</p></noscript>
  <p id="problem" class="problem" role="alert" hidden></p>
  <section id="steps" hidden>
    <ol class="steps">
      <li>
        <a id="download" class="btn">Download Amberline Player</a>
      </li>
      <li>
        <p>Open it. If Windows says "Windows protected your PC", choose More info, then Run anyway.</p>
      </li>
      <li>
        <a id="join" class="btn">Join</a>
        <p id="hint" class="muted">If nothing happens, open Amberline Player and paste this page's link.</p>
        <button id="copy" class="btn secondary" type="button">Copy invite link</button>
        <p id="copied" class="muted" role="status"></p>
      </li>
    </ol>
  </section>
</main>
<script>
/* Amberline join page: one file that asks for nothing. It reads the invite after the # of its own address, checks it, and
   shows the server name as text only. The invite is never sent anywhere. */
const RELEASES = "https://github.com/Amberline-Dev/Project-Amberline/releases/download/";
const DAMAGED = "This invite link is damaged. Ask the host to copy it again.";
const NEWER = "This invite needs a newer Amberline Player. Download it from the invite page.";
const LINES = {
  "126": { scheme: "amberline-player", tag: /^v(\d+\.\d+\.\d+)$/, asset: "Amberline-Player-", app: "Amberline Player", button: "Download Amberline Player", mark: "AMBERLINE" },
  "132": { scheme: "amberline-132-player", tag: /^p132-v(\d+\.\d+\.\d+)$/, asset: "Amberline-132-Player-", app: "Amberline 132 Player", button: "Download Amberline 132 Player", mark: "AMBERLINE 132" }
};

/* The bare base64url invite: what follows #, without a scheme, surrounding spaces and quotes. */
function bareInvite(text) {
  let s = String(text == null ? "" : text).trim().replace(/^["']+|["']+$/g, "").trim();
  const hash = s.indexOf("#");
  if (hash >= 0) s = s.slice(hash + 1);
  const colon = s.indexOf(":");
  if (colon >= 0) s = s.slice(colon + 1).replace(/^\/+/, "").replace(/\/+$/, "");
  return s;
}

function decodeBase64Url(s) {
  if (!/^[A-Za-z0-9_-]+$/.test(s) || s.length % 4 === 1) return null;
  const padded = s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=");
  try {
    const bytes = Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) {
    return null;
  }
}

/* PlatformBootstrap.IsHost: a DNS name or an IPv4 address, ASCII letters, digits, dots and hyphens, at most 253 characters. */
function isHost(host) {
  return typeof host === "string" && host.length <= 253 && /^[A-Za-z0-9.-]+$/.test(host) &&
    host.split(".").every((label) => /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$/.test(label));
}

/* HostAddress.NameProblem: 1 to 40 letters, digits, spaces, dots, hyphens or underscores, starting and ending with a letter or digit. */
function isName(name) {
  return typeof name === "string" && /^[A-Za-z0-9](?:[A-Za-z0-9 ._-]{0,38}[A-Za-z0-9])?$/.test(name) &&
    !/^(CON|PRN|AUX|NUL|COM[0-9]|LPT[0-9])(\..*)?$/i.test(name);
}

/* Returns { invite, encoded } for a valid invite, else { error } with the spec's message. */
function decodeInvite(text) {
  const encoded = bareInvite(text);
  const json = decodeBase64Url(encoded);
  let invite = null;
  try {
    invite = json === null ? null : JSON.parse(json);
  } catch (e) {
    invite = null;
  }
  if (!invite || typeof invite !== "object") return { error: DAMAGED };
  if (!["v", "line", "tag", "host", "port", "pin", "name"].every((key) => key in invite)) return { error: DAMAGED };
  if (invite.v !== 1) return { error: Number.isInteger(invite.v) && invite.v > 1 ? NEWER : DAMAGED };
  const line = invite.line === "126" || invite.line === "132" ? LINES[invite.line] : null;
  const valid = line !== null && typeof invite.tag === "string" && line.tag.test(invite.tag) && isHost(invite.host) &&
    Number.isInteger(invite.port) && invite.port >= 1 && invite.port <= 65535 &&
    typeof invite.pin === "string" && /^[0-9A-Fa-f]{64}$/.test(invite.pin) && isName(invite.name);
  return valid ? { invite: invite, encoded: encoded } : { error: DAMAGED };
}

/* The release's own player: the asset of the invite's tag (126 v<version>, 132 p132-v<version>). */
function downloadUrl(invite) {
  const line = LINES[invite.line];
  return RELEASES + invite.tag + "/" + line.asset + line.tag.exec(invite.tag)[1] + ".exe";
}

function joinUrl(invite, encoded) {
  return LINES[invite.line].scheme + ":" + encoded;
}

/* The line's own labels: its download button and its wordmark. Without a valid invite the wordmark stays AMBERLINE. */
function downloadLabel(invite) {
  return LINES[invite.line].button;
}

function brandMark(invite) {
  return invite && LINES[invite.line] ? LINES[invite.line].mark : "AMBERLINE";
}

function wire() {
  const $ = (id) => document.getElementById(id);
  const show = (text) => {
    $("problem").textContent = text;
    $("problem").hidden = false;
  };
  const result = decodeInvite(location.hash);
  if (result.error) return show(result.error);
  const serverName = result.invite.name;
  document.title = "Join " + serverName;
  $("heading").textContent = "Join " + serverName;
  $("mark").textContent = brandMark(result.invite);
  if (!/Windows/.test(navigator.userAgent)) return show("Open this link on your Windows PC.");
  $("download").href = downloadUrl(result.invite);
  $("download").textContent = downloadLabel(result.invite);
  $("join").href = joinUrl(result.invite, result.encoded);
  $("join").textContent = "Join " + serverName;
  const app = LINES[result.invite.line].app;
  $("hint").textContent = "If nothing happens, open " + app + " and paste this page's link.";
  $("steps").hidden = false;
  $("copy").addEventListener("click", () => {
    Promise.resolve()
      .then(() => navigator.clipboard.writeText(location.href))
      .then(() => { $("copied").textContent = "Copied. Paste it into " + app + "."; },
            () => { $("copied").textContent = "Could not copy. Copy the address from the address bar instead."; });
  });
}

if (typeof document !== "undefined") wire();
</script>
</body>
</html>
