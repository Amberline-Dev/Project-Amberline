# Amberline does not take pull requests (CONTRIBUTING.md): each one is closed with a pointer to Issues and forks.
# pull_request_target runs with this repository's token and never checks out or runs the pull request's code.
name: Close pull requests
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - run: >
          gh pr close "$NUMBER" --repo "$REPO" --comment "Thank you! Amberline does not take pull requests (see CONTRIBUTING.md).
          Please open an issue that describes the bug or the change, and the maintainer will fix it; or keep it in your fork."
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
